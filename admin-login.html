<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CashCard Admin — Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e40af, #3b82f6);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .login-box {
    background: #fff;
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .logo { font-size: 26px; font-weight: 800; text-align: center; margin-bottom: 8px; }
  .logo span { color: #fbbf24; }
  .subtitle { text-align: center; color: #64748b; margin-bottom: 32px; font-size: 14px; }
  label { display: block; font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: 15px; font-family: inherit; margin-bottom: 20px;
  }
  input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
  button {
    width: 100%; padding: 14px; background: linear-gradient(135deg, #1e40af, #3b82f6);
    color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,0.35); }
  .error { background: #fef2f2; color: #991b1b; padding: 12px; border-radius: 8px; margin-top: 16px; display: none; font-size: 14px; }
  .error.show { display: block; }
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">Cash<span>Card</span></div>
  <div class="subtitle">Admin Access</div>
  <label>Admin Key</label>
  <input type="password" id="adminKey" placeholder="Enter your admin key" autofocus>
  <button onclick="login()">Sign In</button>
  <div class="error" id="error"></div>
</div>
<script>
  function login() {
    const key = document.getElementById('adminKey').value.trim();
    const error = document.getElementById('error');
    if (!key) {
      error.textContent = 'Please enter your admin key';
      error.classList.add('show');
      return;
    }
    localStorage.setItem('adminKey', key);
    window.location.href = '/admin';
  }
  document.getElementById('adminKey').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') login();
  });
</script>
</body>
</html>
